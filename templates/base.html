<!doctype html>
<head>
  <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<title>ANPR Car Park System</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<nav>
    <span style="font-weight:600">Godalming ANPR System</span>
    {% if session.logged_in %}
      <a href="{{ url_for('index') }}">Upload</a>
      <a href="{{ url_for('history') }}">History</a>
      <a href="{{ url_for('vehicles') }}">Vehicles</a>
      <a href="{{ url_for('logout') }}" style="margin-left:auto">Logout</a>
    {% endif %}
</nav>
{% with messages = get_flashed_messages() %}
  {% for m in messages %}<p class="flash">{{ m }}</p>{% endfor %}
{% endwith %}
<div class="card">
  {% block content %}{% endblock %}
</div>
